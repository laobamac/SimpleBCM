name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate source metadata
        run: |
          python3 - <<'PY'
          import ast
          import json
          import plistlib
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for path in Path('Tools').glob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          for path in Path('Docs').glob('*.json'):
              json.loads(path.read_text())
          for path in Path('SimpleBCM').glob('*.plist'):
              plistlib.loads(path.read_bytes())
          assert {p.name for p in Path('.').glob('*.xcodeproj')} == {'SimpleBCM.xcodeproj'}
          for project in ['SimpleBCM.xcodeproj']:
              for path in Path(project).rglob('*.xcscheme'):
                  for reference in ET.parse(path).iter('BuildableReference'):
                      assert reference.attrib['ReferencedContainer'] == f'container:{project}', path

          sys.path.insert(0, 'Tools')
          from build import VERSION, fragment
          version = re.search(r'^MODULE_VERSION\s*=\s*(\S+)', Path('Config/Kernel.xcconfig').read_text(), re.M).group(1)
          assert version == VERSION, 'Driver and package versions differ'
          info = plistlib.loads(Path('SimpleBCM/Info.plist').read_bytes())
          assert info['OSBundleCompatibleVersion'] == version
          assert 'as.vit9696.Lilu' not in info['OSBundleLibraries']
          for name in ['README.md', 'README.en.md']:
              assert f'version-{version}-' in Path(name).read_text(), name

          for optional in (False, True):
              config = fragment(optional)
              expected = ['SimpleBCM.kext']
              if optional:
                  expected = ['Lilu.kext', 'AirportBrcmFixup.kext'] + expected + [
                      'AirportBrcmFixup.kext/Contents/PlugIns/AirPortBrcmNIC_Injector.kext']
              assert [entry['BundlePath'] for entry in config['Kernel']['Add']] == expected
              block, = config['Kernel']['Block']
              assert block['Identifier'] == 'com.apple.iokit.IOSkywalkFamily'
              assert block['Strategy'] == 'Exclude'
              for entry in config['Kernel']['Add'] + [block]:
                  assert entry['Enabled'] and entry['Arch'] == 'x86_64'
                  assert (entry['MinKernel'], entry['MaxKernel']) == ('23.0.0', '25.99.99')
          print('Source metadata and version checks passed.')
          PY
